<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Classroom Widgets OG card</title>
<!-- Fixed-size media composition, not a web page. Render with ./render.sh. -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: 'Poppins', sans-serif; -webkit-font-smoothing: antialiased; color: #fffdf8; background: #88501d; }
  .bg { position: absolute; inset: -40px; width: 1280px; height: 710px; object-fit: cover; }
  .shade { position: absolute; inset: 0; background: linear-gradient(100deg, #482307b8, #6c350838 65%, #c5892420); }
  .copy { position: absolute; left: 64px; top: 110px; }
  h1 { margin: 0; font-size: 78px; line-height: 1.13; letter-spacing: -3px; font-weight: 700; }
  .subtitle { margin: 25px 0 0; font-size: 27px; line-height: 1.6; color: #ffe8ca; font-weight: 500; }
  .link { position: absolute; left: 64px; bottom: 92px; padding: 12px 28px; border-radius: 22px; background: #fff4de; color: #653914; font-size: 36px; font-weight: 700; letter-spacing: -.8px; box-shadow: 0 8px 24px #3d210326; }
  .platforms { position: absolute; left: 66px; bottom: 43px; font-size: 20px; font-weight: 500; color: #ffe8ca; }
  .scene { position: absolute; right: 26px; top: 33px; width: 510px; height: 540px; overflow: visible; }
  .label { font-family: 'Poppins', sans-serif; font-weight: 600; }
</style>
</head>
<body>
  <img class="bg" src="../display-widget-demo/pipeline/assets/lowpoly-bg-blur.jpg" alt="">
  <div class="shade"></div>
  <div class="copy">
    <h1>Classroom<br>Widgets</h1>
    <p class="subtitle">Free timers, polls, Q&amp;A &amp; more.<br>No logins. Just teach.</p>
  </div>
  <div class="link" id="site-link">widgets.tk.sg <span aria-hidden="true">↗</span></div>
  <div class="platforms">Web app · macOS · Windows · Linux</div>
  <svg class="scene" viewBox="0 0 510 540" role="img" aria-label="Our hamster starts a rainbow timer and brings a live poll to life">
    <defs>
      <linearGradient id="rainbow" gradientUnits="userSpaceOnUse" x1="111" x2="429"><stop stop-color="#ec5a4b"/><stop offset=".167" stop-color="#f48d2f"/><stop offset=".333" stop-color="#f4c332"/><stop offset=".5" stop-color="#5cb866"/><stop offset=".667" stop-color="#2fb2ad"/><stop offset=".833" stop-color="#4a8ddf"/><stop offset="1" stop-color="#9868d8"/></linearGradient>
      <radialGradient id="face" cx="35%" cy="25%" r="80%"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#eee2cb"/></radialGradient>
      <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#45280c" flood-opacity=".25"/></filter>
      <filter id="sticker" x="-40%" y="-50%" width="180%" height="200%">
        <feMorphology in="SourceAlpha" operator="dilate" radius=".65" result="edge"/>
        <feFlood flood-color="#fffdf8"/><feComposite in2="edge" operator="in"/>
        <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <!-- The app's hamster, from scripts/generateAppIcons.mjs / timer creatures.tsx. -->
      <g id="hamster-art" filter="url(#sticker)">
        <ellipse cx="0" cy="0" rx="6" ry="4.5" fill="#D2691E" stroke="#8B4513" stroke-width=".8"/>
        <g id="head">
          <circle cx="-4" cy="-1.5" r="3.5" fill="#DEB887" stroke="#8B4513" stroke-width=".8"/>
          <circle cx="-5.5" cy="-3.5" r="1.3" fill="#D2691E"/><circle cx="-2.5" cy="-3.5" r="1.3" fill="#D2691E"/>
          <g id="eyes"><circle cx="-5" cy="-1.5" r=".7"/><circle cx="-3" cy="-1.5" r=".7"/><circle cx="-4.8" cy="-1.8" r=".3" fill="#fff"/><circle cx="-2.8" cy="-1.8" r=".3" fill="#fff"/></g>
          <circle cx="-6.5" cy="-.5" r=".4" fill="#8B4513"/>
        </g>
        <g id="feet" fill="#654321" stroke="#3D2611" stroke-width=".3">
          <ellipse cx="-2.5" cy="3.5" rx="1" ry="1.5"/><ellipse cx="-4" cy="3.5" rx="1" ry="1.5"/><ellipse cx="1.5" cy="3.5" rx="1" ry="1.5"/><ellipse cx="3" cy="3.5" rx="1" ry="1.5"/>
        </g>
        <path d="M4.5 0Q7 -1.5 8.5 1" stroke="#8B4513" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      </g>
    </defs>
    <!-- The hamster peeks from behind the dial, then hops onto its spent notch. -->
    <g id="dial" filter="url(#shadow)">
      <circle cx="270" cy="265" r="165" fill="#fffdf8"/>
      <circle cx="270" cy="265" r="132" fill="url(#face)" stroke="#e3d5bc" stroke-width="24"/>
      <path id="band-border" fill="none" stroke="#fffdf8" stroke-width="78" stroke-linecap="round"/>
      <path id="band" fill="none" stroke="url(#rainbow)" stroke-width="54" stroke-linecap="round"/>
    </g>
    <g id="mascot"><use href="#hamster-art"/></g>
    <g id="tap" fill="none" stroke="#fff2c5" stroke-width="5" stroke-linecap="round"><path d="M112 235l-17 5M120 249l-10 14M110 219l-17 -8"/></g>
    <g id="poll" transform="translate(270 375) rotate(6)">
      <rect width="206" height="149" rx="23" fill="#fffdf8" filter="url(#shadow)"/>
      <text x="22" y="35" class="label" font-size="17" fill="#67482f">Everyone's in.</text>
      <path d="M22 121H183" stroke="#e8dfd1" stroke-width="2"/>
      <rect id="bar1" x="26" width="35" rx="7" fill="#79a67b"/>
      <rect id="bar2" x="83" width="35" rx="7" fill="#db9870"/>
      <rect id="bar3" x="140" width="35" rx="7" fill="#8caacb"/>
    </g>
    <g transform="translate(74 389) rotate(-8)">
      <rect width="148" height="56" rx="18" fill="#fff4de" filter="url(#shadow)"/>
      <text id="timer-label" x="74" y="36" text-anchor="middle" class="label" font-size="21" fill="#67482f">Let's go!</text>
    </g>
    <path id="spark" d="M410 86l7 20 21 7-21 7-7 20-7-20-21-7 21-7Z" fill="#ffe4a0" stroke="#fffdf8" stroke-width="5"/>
  </svg>
<script>
const el = id => document.getElementById(id);
const ease = (t, start, end) => { const x = Math.max(0, Math.min(1, (t - start) / (end - start))); return x * x * (3 - 2 * x); };
const arc = end => {
  const point = angle => [270 + 132 * Math.sin(angle * Math.PI / 180), 265 - 132 * Math.cos(angle * Math.PI / 180)];
  return `M${point(16).join(' ')} A132 132 0 ${end - 16 > 180 ? 1 : 0} 1 ${point(end).join(' ')}`;
};
// Explicit time makes the JPEG and every encoded video frame reproducible.
window.renderAt = seconds => {
  const t = ((seconds % 6) + 6) % 6;
  const hop = ease(t, .7, 1.5);
  const reset = ease(t, 5, 5.9);
  const active = hop * (1 - reset);
  const progress = ease(t, 1.6, 4.6) * (1 - reset);
  const nod = Math.sin(ease(t, 3.6, 4.4) * Math.PI * 2) * 7;
  // Move the same opaque mascot between layers at the top of its hop.
  if (active < .55) el('dial').before(el('mascot'));
  else el('dial').after(el('mascot'));
  const peek = 20 * (1 - ease(t, 0, .6) + reset);
  // Rotate around the dial centre, keeping the hamster tangent to the track.
  const slide = -34 * (ease(t, 3.1, 3.85) - ease(t, 4.0, 4.8));
  const x = 265 - active * 105;
  const y = 152 + active * 12 + peek - Math.sin(active * Math.PI) * 85;
  el('mascot').setAttribute('transform', `translate(270 265) rotate(${slide}) translate(${x - 270} ${y - 265}) rotate(${-32 * active}) scale(12)`);
  const pop = Math.sin(Math.PI * ease(t, 3.6, 4.8));
  el('site-link').style.transform = `translateY(${-5 * pop}px) scale(${1 + .08 * pop})`;
  el('head').setAttribute('transform', `rotate(${nod} -4 -1.5)`);
  const blink = t > 3.25 && t < 3.4 ? .12 : 1;
  el('eyes').setAttribute('transform', `translate(0 -1.5) scale(1 ${blink}) translate(0 1.5)`);
  for (const id of ['band', 'band-border']) el(id).setAttribute('d', arc(258 - progress * 64));
  el('tap').style.opacity = Math.sin(ease(t, 1.45, 1.95) * Math.PI);
  const bars = ease(t, 1.8, 2.8) * (1 - reset);
  [42, 67, 53].forEach((height, i) => {
    const h = 10 + (height - 10) * bars;
    el(`bar${i + 1}`).setAttribute('y', 120 - h);
    el(`bar${i + 1}`).setAttribute('height', h);
  });
  el('poll').setAttribute('transform', `translate(270 ${385 - 10 * bars}) rotate(${6 - 3 * bars})`);
  el('timer-label').textContent = t < 1.6 || t >= 5 ? "Let's go!" : `00:0${5 - Math.min(3, Math.floor(t - 1.6))}`;
  el('spark').style.opacity = .65 + .35 * Math.sin(t * Math.PI / 6) ** 2;
};
window.renderAt(3);
// ?animate is a local art preview only; published previews use the encoded MP4.
if (new URLSearchParams(location.search).has('animate') && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
  const start = performance.now();
  const tick = now => { window.renderAt((now - start) / 1000); requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
