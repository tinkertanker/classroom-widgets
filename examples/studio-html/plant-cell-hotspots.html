<!doctype html><html lang="en-SG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inside a Plant Cell — Organelle Map</title><style>*{box-sizing:border-box}body{margin:0;background:#edf7ed;color:#193d23;font:15px system-ui}main{max-width:920px;margin:auto;padding:14px}.card{background:white;padding:14px;border-radius:16px}.cell{position:relative;height:430px;border:18px solid #3f7548;border-radius:35px;background:#9dcc91;box-shadow:inset 0 0 0 7px #e1f3d9}.vacuole{position:absolute;left:34%;top:24%;width:43%;height:52%;background:#d9eff4;border:5px solid #81abb3;border-radius:40%}.nucleus{position:absolute;left:17%;top:30%;width:18%;aspect-ratio:1;border-radius:50%;background:#9b73ad}.chloroplast{position:absolute;width:12%;height:8%;background:#2e8a48;border-radius:50%}.hot{position:absolute;min-width:44px;min-height:44px;border:3px solid white;border-radius:50%;background:#185e34;color:white;font-weight:bold}.hot.done{background:#d39a19}.panel{padding:11px;background:#e6f4e7;border-radius:10px;min-height:65px;margin-top:10px}@media(max-width:600px){.cell{height:330px}}</style></head><body><main><h1>Which structures keep a plant cell working?</h1><p>Tap each marker and connect structure to function.</p><section class="card"><div class="cell" role="img" aria-label="Plant cell with cell wall, membrane, vacuole, nucleus and chloroplasts"><div class="vacuole"></div><div class="nucleus"></div><i class="chloroplast" style="left:72%;top:12%"></i><i class="chloroplast" style="left:79%;top:79%"></i><i class="chloroplast" style="left:20%;top:72%"></i><button class="hot" style="left:-3%;top:45%" data-i="0">1</button><button class="hot" style="left:6%;top:45%" data-i="1">2</button><button class="hot" style="left:52%;top:45%" data-i="2">3</button><button class="hot" style="left:21%;top:35%" data-i="3">4</button><button class="hot" style="left:75%;top:10%" data-i="4">5</button></div><div id="panel" class="panel">Choose a numbered structure.</div><p id="progress">0 / 5 explored</p><button id="reset">Reset exploration</button></section></main><script>const facts=[['Cell wall','Rigid cellulose supports shape and resists pressure when water enters.'],['Cell membrane','Partially permeable membrane controls substances entering and leaving.'],['Large central vacuole','Cell sap pushes outwards when water-filled, keeping the cell turgid.'],['Nucleus','Contains genetic material and controls many cell activities.'],['Chloroplast','Chlorophyll absorbs light energy for photosynthesis.']];let seen=new Set;document.querySelector('.cell').onclick=e=>{if(!e.target.classList.contains('hot'))return;let i=+e.target.dataset.i;seen.add(i);e.target.classList.add('done');panel.innerHTML=`<strong>${facts[i][0]}:</strong> ${facts[i][1]}`;progress.textContent=`${seen.size} / 5 explored`};reset.onclick=()=>{seen.clear();document.querySelectorAll('.hot').forEach(x=>x.classList.remove('done'));panel.textContent='Choose a numbered structure.';progress.textContent='0 / 5 explored'};</script></body></html>
