<!doctype html><html lang="ms-SG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Padankan Perkataan di Bilik Darjah — Latihan Kosa Kata</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf8ef;color:#183b27;font:15px system-ui}main{max-width:900px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:white;padding:14px;border-radius:16px;box-shadow:0 3px 12px #275d3420}label{display:block;padding:7px;background:#f1f9f2;margin:6px;border-radius:8px;font-weight:bold}select,button{width:100%;min-height:44px;border:1px solid #78a883;border-radius:9px;padding:7px;font:inherit}button{background:#378653;color:#fff;font-weight:bold;margin-top:8px}.msg{min-height:45px;font-weight:bold}.hint{color:#426e4c}@media(max-width:650px){.grid{grid-template-columns:1fr}.card{padding:10px}}
</style></head><body><main><h1>Apa yang kita buat dan gunakan di kelas?</h1><p>Padankan perkataan Melayu dengan maksudnya. Kemudian asingkan perbuatan dan benda.</p><div class="grid"><section class="card"><h2>1 · Padankan maksud</h2><div id="match"></div><button id="checkMatch">Semak padanan</button><p id="mm" class="msg" aria-live="polite"></p></section><section class="card"><h2>2 · Perbuatan atau benda?</h2><div id="sort"></div><button id="checkSort">Semak kumpulan</button><button id="reset">Tetapkan semula</button><p id="sm" class="msg"></p><p class="hint">Petunjuk: awalan <strong>meN-</strong> sering muncul pada kata kerja. Bolehkah saya melakukannya, atau menyentuh bendanya?</p></section></div></main><script>
const words=[['membaca','reading','act'],['menulis','writing','act'],['buku','book','thing'],['papan putih','whiteboard','thing']],mean='<option value="">Pilih…</option><option>reading</option><option>writing</option><option>book</option><option>whiteboard</option>',kind='<option value="">Pilih…</option><option value="act">Perbuatan</option><option value="thing">Benda</option>';match.innerHTML=words.map(w=>`<label>${w[0]}<select data-a="${w[1]}">${mean}</select></label>`).join('');sort.innerHTML=words.map(w=>`<label>${w[0]}<select data-a="${w[2]}">${kind}</select></label>`).join('');checkMatch.onclick=()=>mm.textContent=[...match.querySelectorAll('select')].every(x=>x.value==x.dataset.a)?'Bagus! Semua perkataan dipadankan dengan betul.':'Cuba sebut perkataan dalam ayat kelas yang mudah.';checkSort.onclick=()=>sm.textContent=[...sort.querySelectorAll('select')].every(x=>x.value==x.dataset.a)?'Tepat: membaca dan menulis ialah perbuatan; buku dan papan putih ialah benda.':'Tanya sama ada perkataan itu tindakan atau objek.';reset.onclick=()=>{document.querySelectorAll('select').forEach(x=>x.value='');mm.textContent=sm.textContent=''};
</script></body></html>
