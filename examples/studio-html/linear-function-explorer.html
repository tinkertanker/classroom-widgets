<!doctype html><html lang="en-SG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linear Function Explorer — Gradient and Intercept</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef0ff;color:#22274d;font:15px system-ui}main{max-width:950px;margin:auto;padding:15px}.grid{display:grid;grid-template-columns:1fr 1.4fr;gap:14px}.card{background:white;padding:14px;border-radius:16px}label{display:block;margin:14px 0;font-weight:bold}input{width:100%;accent-color:#4c58c9}output{font-size:22px}svg{width:100%;height:330px;background:#fafaff}button{min-height:44px;border:0;border-radius:9px;padding:8px;background:#4c58c9;color:#fff;font-weight:bold}.answers button{display:block;width:100%;margin:5px;background:#eceeff;color:#22274d}.ok{outline:3px solid #32935f}@media(max-width:680px){.grid{grid-template-columns:1fr}svg{height:230px}}
</style></head><body><main><h1>What does each number do to the line?</h1><p>Predict whether the line will turn or shift; then change one coefficient at a time.</p><div class="grid"><section class="card"><h2>y = <span id="eq"></span></h2><label>Gradient m: <output id="mv"></output><input id="m" type="range" min="-3" max="3" step=".5" value="1"></label><label>Vertical intercept c: <output id="cv"></output><input id="c" type="range" min="-5" max="5" value="0"></label><p>When x = 2, y = <strong id="y2"></strong></p><button id="reset">Reset</button><h3>When a line falls left to right…</h3><div class="answers"><button data-ok>the gradient is negative</button><button>the gradient is positive</button><button>the intercept is zero</button></div><p id="msg"></p></section><section class="card"><h2>Graph of y = mx + c</h2><svg viewBox="0 0 500 400" aria-label="Straight line graph"><path d="M25 200H475M250 20V380M25 65H475M25 335H475M100 20V380M400 20V380" stroke="#d9dcf4"/><path id="plot" stroke="#4c58c9" stroke-width="6" fill="none"/><circle id="intercept" r="7" fill="#e45d78"/><text x="455" y="220">x</text><text x="260" y="35">y</text></svg><p><strong>m</strong> controls direction and steepness. <strong>c</strong> moves the line vertically.</p></section></div></main><script>
function draw(){let a=+m.value,b=+c.value;mv.value=a;cv.value=b;eq.textContent=`${a}x ${b<0?'−':'+'} ${Math.abs(b)}`;y2.textContent=(2*a+b).toFixed(1);let yL=200-(a*-5+b)*9,yR=200-(a*5+b)*9;plot.setAttribute('d',`M25 ${yL} L475 ${yR}`);intercept.setAttribute('cx',250);intercept.setAttribute('cy',200-b*9)}m.oninput=c.oninput=draw;reset.onclick=()=>{m.value=1;c.value=0;draw()};document.querySelector('.answers').onclick=e=>{if(e.target.tagName!='BUTTON')return;msg.textContent=e.target.dataset.ok!==undefined?'Correct: y decreases as x increases.':'Try positive and negative m while c stays fixed.';if(e.target.dataset.ok!==undefined)e.target.classList.add('ok')};draw();
</script></body></html>
