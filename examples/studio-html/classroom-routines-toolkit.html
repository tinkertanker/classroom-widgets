<!doctype html><html lang="en-SG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Classroom Routines Toolkit — Ready to Learn</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f0ff;color:#24204b;font:15px system-ui}main{max-width:960px;margin:auto;padding:16px}h1{margin:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:white;border-radius:16px;padding:15px;box-shadow:0 3px 12px #29205b20}#time{font-size:42px;font-variant-numeric:tabular-nums}button{min-height:44px;padding:9px 14px;border:0;border-radius:10px;background:#554ac3;color:white;font-weight:bold;margin:3px}#pick{font-size:22px;min-height:34px}.tasks label{display:block;padding:8px;background:#f3f2ff;border-radius:8px;margin:5px}.tasks input{width:24px;height:24px;vertical-align:middle}.lights{display:flex}.lights button{flex:1;background:#777}.lights [data-c=red]{background:#c84848}.lights [data-c=amber]{background:#d39419}.lights [data-c=green]{background:#25885a}.selected{outline:4px solid #211a61;outline-offset:2px}progress{width:100%;height:20px}@media(max-width:620px){.grid{grid-template-columns:1fr}body{font-size:14px}.card{padding:11px}}
</style></head><body><main><h1>Classroom Routines Toolkit</h1><p>Follow the routine and signal when you are ready.</p><div class="grid"><section class="card"><h2>Settle-in timer</h2><div id="time">05:00</div><button id="start">Start</button><button id="pause">Pause</button><button id="reset">Reset</button><p id="timerMsg" aria-live="polite"></p></section><section class="card"><h2>Discussion randomiser</h2><p>Choose how we discuss the first question.</p><div id="pick">Tap “Choose”</div><button id="choose">Choose</button><button id="again">Reset choices</button></section><section class="card tasks"><h2>Before you begin</h2><label><input type="checkbox"> Place required materials on your desk</label><label><input type="checkbox"> Read the instructions once</label><label><input type="checkbox"> Prepare one question if unclear</label><progress max="3" value="0"></progress><strong id="progress">0 / 3 ready</strong></section><section class="card"><h2>How ready are you?</h2><div class="lights"><button data-c="red">Need help</button><button data-c="amber" class="selected">Nearly ready</button><button data-c="green">Ready</button></div><p id="signal">I am nearly ready.</p></section></div></main><script>
let left=300,timer=null;const time=document.querySelector('#time');function show(){time.textContent=String(left/60|0).padStart(2,'0')+':'+String(left%60).padStart(2,'0')}start.onclick=()=>{if(timer)return;timer=setInterval(()=>{left--;show();if(left<=0){clearInterval(timer);timer=null;timerMsg.textContent='Time is up. Face the front and get ready.'}},1000)};pause.onclick=()=>{clearInterval(timer);timer=null};reset.onclick=()=>{clearInterval(timer);timer=null;left=300;timerMsg.textContent='';show()};let pool=[];const items=['Think, pair, share','Mini whiteboards','Table spokesperson','Silent thinking first'];function refill(){pool=[...items]}refill();choose.onclick=()=>{if(!pool.length)return pick.textContent='All four used — reset choices.';pick.textContent=pool.splice(Math.random()*pool.length|0,1)[0]};again.onclick=()=>{refill();pick.textContent='Choices reset'};document.querySelector('.tasks').onchange=()=>{let n=document.querySelectorAll('.tasks input:checked').length;document.querySelector('progress').value=n;progress.textContent=n+' / 3 ready'};document.querySelector('.lights').onclick=e=>{if(!e.target.dataset.c)return;document.querySelectorAll('.lights button').forEach(b=>b.classList.remove('selected'));e.target.classList.add('selected');signal.textContent={red:'I need help before I begin.',amber:'I am nearly ready.',green:'I am ready to begin.'}[e.target.dataset.c]};
</script></body></html>
