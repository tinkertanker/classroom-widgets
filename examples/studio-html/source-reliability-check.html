<!doctype html><html lang="en-SG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Can We Trust This Source? — Corroboration Check</title><style>*{box-sizing:border-box}body{margin:0;background:#fff1eb;color:#4b2d24;font:15px system-ui}main{max-width:950px;margin:auto;padding:15px}.source{background:#783e31;color:white;padding:17px;border-radius:14px;font-size:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:white;padding:13px;border-radius:14px}button,input{width:100%;min-height:43px;margin:4px 0;border:1px solid #b98c80;border-radius:8px;padding:7px;font:inherit}button{background:#f7ddd5}.ok{background:#bce5c7}.msg{min-height:55px;font-weight:bold}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>Reliable, useful — or both?</h1><div class="source"><strong>Source A:</strong> a political party’s pre-election campaign leaflet: “Only our plan can guarantee every family a better future.”</div><p>Use origin, audience and purpose; then identify evidence that could check the claim.</p><div class="grid"><section class="card"><h2>Purpose</h2><div class="q"><button data-ok>Win voters’ support</button><button>Create a neutral record</button><button>Report a scientific test</button></div><p class="msg"></p></section><section class="card"><h2>Best corroboration</h2><div class="q"><button data-ok>Independent family-outcome data and detailed plan records</button><button>A larger copy of the leaflet</button><button>An anonymous rumour</button></div><p class="msg"></p></section><section class="card"><h2>Name the skill</h2><label>Checking a claim against other sources:<input id="term" placeholder="Historical term"></label><button id="check">Check</button><button id="reset">Reset</button><p id="tm" class="msg"></p></section></div></main><script>document.querySelectorAll('.q').forEach(q=>q.onclick=e=>{if(e.target.tagName!='BUTTON')return;let ok=e.target.hasAttribute('data-ok');q.nextElementSibling.textContent=ok?'Correct: purpose shapes wording, and independent evidence tests it.':'Choose the likely persuasive purpose or relevant independent evidence.';if(ok)e.target.classList.add('ok')});check.onclick=()=>tm.textContent=/^corroborat(e|ion|ing)$/i.test(term.value.trim())?'Correct. Corroboration compares evidence before judgement.':'Think of checking agreement or disagreement across sources.';reset.onclick=()=>{term.value='';document.querySelectorAll('.msg').forEach(x=>x.textContent='');document.querySelectorAll('.ok').forEach(x=>x.classList.remove('ok'))};</script></body></html>
