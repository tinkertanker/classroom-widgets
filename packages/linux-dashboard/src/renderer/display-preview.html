<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src blob:;">
  <link rel="stylesheet" href="display-preview.css">
</head>
<body>
  <main id="preview">
    <video id="video" autoplay playsinline></video>
    <div id="bar">
      <button id="power" type="button">Turn preview on</button>
      <span id="status"></span>
      <button id="layout" type="button" aria-label="Position and size" title="Position and size">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor"/><rect x="3" y="4" width="5" height="8" rx=".5" fill="currentColor"/></svg>
      </button>
      <button id="menu" type="button" aria-label="Menu">⋯</button>
    </div>
  </main>
  <script src="display-preview.js"></script>
</body>
</html>
