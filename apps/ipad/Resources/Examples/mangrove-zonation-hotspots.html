<!doctype html><html lang="en-SG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explore a Mangrove Shore — Tidal Transect</title><style>*{box-sizing:border-box}body{margin:0;background:#eaf7f6;color:#163b42;font:15px system-ui}main{max-width:960px;margin:auto;padding:14px}.card{background:white;padding:14px;border-radius:16px}.scene{height:390px;position:relative;overflow:hidden;border-radius:14px;background:linear-gradient(#9eddf0 0 42%,#3ba2bd 42% 65%,#7a6044 65%)}.land{position:absolute;right:-5%;bottom:0;width:75%;height:55%;background:#80694a;clip-path:polygon(0 70%,100% 0,100% 100%,0 100%)}.tree{position:absolute;font-size:90px;filter:saturate(.7)}.t1{left:37%;top:23%}.t2{left:68%;top:10%}.roots{position:absolute;left:45%;top:55%;font-size:50px}.hot{position:absolute;min-width:45px;min-height:45px;border:3px solid white;border-radius:50%;background:#126e75;color:white;font-weight:bold;font-size:18px}.hot.done{background:#318b56}.panel{min-height:70px;padding:10px;background:#e9f7f4;border-radius:10px;margin-top:10px}#progress{font-weight:bold}@media(max-width:600px){.scene{height:310px}.tree{font-size:65px}}</style></head><body><main><h1>How do mangroves cope where land meets sea?</h1><p>Tap every marker from sea to land. Identify a challenge and an adaptation.</p><section class="card"><div class="scene" role="img" aria-label="Cross-section from tidal water across muddy mangrove shore to higher ground"><div class="land"></div><span class="tree t1">🌳</span><span class="tree t2">🌳</span><span class="roots">╱╲╱╲</span><button class="hot" style="left:8%;top:55%" data-i="0">1</button><button class="hot" style="left:31%;top:70%" data-i="1">2</button><button class="hot" style="left:48%;top:50%" data-i="2">3</button><button class="hot" style="left:67%;top:65%" data-i="3">4</button><button class="hot" style="left:87%;top:35%" data-i="4">5</button></div><div class="panel" id="panel" aria-live="polite">Choose a numbered region.</div><p id="progress">0 / 5 regions explored</p><button id="reset">Reset exploration</button></section></main><script>const facts=[['Tidal channel','Tides cover and uncover the shore, changing depth and salinity while carrying sediment and nutrients.'],['Soft, oxygen-poor mud','Fine wet sediment contains little oxygen. Animals burrow and trees raise specialised roots for gas exchange.'],['Prop roots','Arching roots brace trees in unstable mud and slow water so sediment settles.'],['Breathing roots','Pencil-like roots rise above mud, allowing gas exchange at low tide.'],['Higher ground','Flooding is less frequent, so conditions are usually less salty and waterlogged.']];let seen=new Set;document.querySelector('.scene').onclick=e=>{if(!e.target.classList.contains('hot'))return;let i=+e.target.dataset.i;seen.add(i);e.target.classList.add('done');panel.innerHTML=`<strong>${facts[i][0]}</strong> — ${facts[i][1]}`;progress.textContent=`${seen.size} / 5 regions explored`};reset.onclick=()=>{seen.clear();document.querySelectorAll('.hot').forEach(x=>x.classList.remove('done'));panel.textContent='Choose a numbered region.';progress.textContent='0 / 5 regions explored'};</script></body></html>
