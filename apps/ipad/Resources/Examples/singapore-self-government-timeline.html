<!doctype html><html lang="en-SG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Road to Self-Government — Singapore Timeline</title><style>*{box-sizing:border-box}body{margin:0;background:#fff0f3;color:#4b2430;font:14px system-ui}main{max-width:1020px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:white;padding:14px;border-radius:15px}.step{display:flex;align-items:center;padding:8px;margin:6px;background:#fff0f3;border-left:5px solid #bd526e;border-radius:7px}.step button{margin-left:auto}select,button{min-height:42px;border:1px solid #c58898;border-radius:8px;padding:6px;font:inherit}select{display:block;width:100%;margin-top:4px}.match{padding:6px}.msg{min-height:35px;font-weight:bold}@media(max-width:670px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>How did political participation expand?</h1><p>Use dates for order, then connect each development to why it mattered.</p><div class="grid"><section class="card"><h2>1 · Chronology</h2><div id="events"></div><button id="checkO">Check order</button><button id="reset">Reset</button><p id="om" class="msg"></p></section><section class="card"><h2>2 · Significance</h2><div id="matches"></div><button id="checkM">Check matches</button><p id="mm" class="msg"></p></section></div></main><script>const ev=['1948: First limited Legislative Council election','1955: Rendel Constitution expands elected representation','1957: Lim Yew Hock leads successful constitutional talks','1959: Full internal self-government'],sig=['Introduced limited electoral participation','Created a legislature with a majority of elected seats','Secured agreement for greater local control','Placed most domestic affairs under elected local government'];let seq=[2,0,3,1];function render(){events.innerHTML=seq.map((n,i)=>`<div class="step">${ev[n]}<button data-i="${i}">↑</button></div>`).join('')}events.onclick=e=>{let i=+e.target.dataset.i;if(!i)return;[seq[i],seq[i-1]]=[seq[i-1],seq[i]];render()};checkO.onclick=()=>om.textContent=seq.every((x,i)=>x==i)?'Correct: participation and local responsibility expanded over time.':'Use the dates first, then check that changes build towards 1959.';matches.innerHTML=ev.map((x,i)=>`<label class="match">${x.split(':')[0]}<select data-a="${i}"><option value="">Choose significance…</option>${sig.map((s,j)=>`<option value="${j}">${s}</option>`).join('')}</select></label>`).join('');checkM.onclick=()=>mm.textContent=[...matches.querySelectorAll('select')].every(x=>x.value==x.dataset.a)?'All matched: chronology is connected to political significance.':'Distinguish voting, elected seats, negotiated change and local control.';reset.onclick=()=>{seq=[2,0,3,1];render();om.textContent=''};render();</script></body></html>
