<!doctype html><html lang="en-SG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fraction Equivalence Detective — Three Clues</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff7df;color:#332708;font:15px system-ui}main{max-width:900px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:white;padding:14px;border-radius:15px;box-shadow:0 3px 12px #72571620}.bar{display:flex;height:45px;margin:10px 0}.bar i{flex:1;border:1px solid #725716}.bar .fill{background:#efb72e}button,input{min-height:44px;border-radius:9px;border:1px solid #b69234;padding:8px;font:inherit}button{display:block;width:100%;margin:5px 0;background:#fff1bd}.ok{background:#bfe7c9}.bad{background:#f7c3bc}.feedback{min-height:60px;font-weight:bold}@media(max-width:680px){.grid{grid-template-columns:1fr}body{font-size:14px}.card{padding:10px}}
</style></head><body><main><h1>Fraction Equivalence Detective</h1><p>Decide before checking. Equivalent fractions name the same quantity.</p><div class="grid"><section class="card"><h2>Clue 1: simplify</h2><div class="bar"><i class="fill"></i><i class="fill"></i><i class="fill"></i><i></i><i></i><i></i></div><p>Which equals 3/6?</p><div class="q" data-answer="1/2"><button>1/2</button><button>3/12</button><button>6/9</button><button>2/6</button></div><p class="feedback"></p></section><section class="card"><h2>Clue 2: same operation</h2><p>Why is 2/5 = 6/15?</p><div class="q" data-answer="Multiply both by 3"><button>Add 4 and 10</button><button>Multiply both by 3</button><button>Multiply numerator only</button><button>Add 3 to both</button></div><p class="feedback"></p></section><section class="card"><h2>Clue 3: explain</h2><label>4/6 = 2/3 because both 4 and 6 were divided by…<input id="answer" inputmode="text" placeholder="number or word"></label><button id="check">Check</button><button id="reset">Reset all</button><p id="last" class="feedback" aria-live="polite"></p></section></div></main><script>
document.querySelectorAll('.q').forEach(q=>q.onclick=e=>{if(e.target.tagName!='BUTTON')return;let ok=e.target.textContent==q.dataset.answer;e.target.className=ok?'ok':'bad';q.nextElementSibling.textContent=ok?'Correct! The same value is preserved.':'Try simplifying or applying the same operation to both parts.'});check.onclick=()=>{let a=answer.value.trim().toLowerCase();last.textContent=a=='2'||a=='two'?'Yes. Dividing both parts by 2 preserves the value.':'Which common factor changes 4→2 and 6→3?'};reset.onclick=()=>{answer.value='';last.textContent='';document.querySelectorAll('button').forEach(x=>{if(x.id!='check'&&x.id!='reset')x.className=''});document.querySelectorAll('.feedback').forEach(x=>x.textContent='')};
</script></body></html>
