<!doctype html><html lang="en-SG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build a Clear Explanation — Rain Paragraph</title><style>*{box-sizing:border-box}body{margin:0;background:#eff0ff;color:#292b55;font:14px system-ui}main{max-width:1000px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:white;padding:14px;border-radius:15px}label,.step{display:block;padding:7px;margin:5px;background:#f1f2ff;border-radius:8px}select,button{min-height:42px;border:1px solid #9a9fd0;border-radius:8px;padding:6px;font:inherit}select{width:100%}button{background:#5962bb;color:white;font-weight:bold}.step{display:flex;align-items:center}.step button{margin-left:auto}.msg{font-weight:bold;min-height:30px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>How does rain form? Build the paragraph.</h1><p>Identify each sentence’s job, then arrange the explanation.</p><div class="grid"><section class="card"><h2>1 · Sentence jobs</h2><div id="jobs"></div><button id="checkJ">Check jobs</button><p id="jm" class="msg"></p></section><section class="card"><h2>2 · Clearest order</h2><div id="order"></div><button id="checkO">Check paragraph</button><button id="reset">Reset</button><p id="om" class="msg"></p></section></div></main><script>const s=['Rain forms through a series of changes in water in the atmosphere.','First, warm water evaporates and rises as water vapour.','Higher in the air, the vapour cools and condenses into droplets.','When droplets grow heavy enough, they fall as rain and the cycle continues.'],a=['topic','support','support','conclusion'],opts='<option value="">Choose…</option><option value="topic">Topic sentence</option><option value="support">Supporting detail</option><option value="conclusion">Concluding link</option>';jobs.innerHTML=s.map((x,i)=>`<label>${x}<select data-a="${a[i]}">${opts}</select></label>`).join('');checkJ.onclick=()=>jm.textContent=[...jobs.querySelectorAll('select')].every(x=>x.value==x.dataset.a)?'Correct: frame, develop, then complete the explanation.':'Find the broad opening, stages, and sentence that closes the process.';let seq=[3,1,0,2];function render(){order.innerHTML=seq.map((n,i)=>`<div class="step">${i+1}. ${s[n]}<button data-i="${i}">↑</button></div>`).join('')}order.onclick=e=>{let i=+e.target.dataset.i;if(!i)return;[seq[i],seq[i-1]]=[seq[i-1],seq[i]];render()};checkO.onclick=()=>om.textContent=seq.every((x,i)=>x==i)?'Well organised: main idea, time-ordered stages, final result.':'Start with the whole process, then follow the water step by step.';reset.onclick=()=>{seq=[3,1,0,2];render();om.textContent=''};render();</script></body></html>
