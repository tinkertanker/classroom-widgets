<!DOCTYPE html>
<html>
<head>
    <title>Test localStorage</title>
</head>
<body>
    <h1>LocalStorage Test for Classroom Widgets</h1>
    <button onclick="testStorage()">Test LocalStorage</button>
    <button onclick="clearStorage()">Clear Storage</button>
    <pre id="output"></pre>
    
    <script>
        function testStorage() {
            const output = document.getElementById('output');
            
            // Check the current V2 storage key
            const stored = localStorage.getItem('classroom-widgets-storage-v2');
            if (stored) {
                output.textContent = 'Found classroom-widgets-storage-v2:\n' + JSON.stringify(JSON.parse(stored), null, 2);
            } else {
                output.textContent = 'No V2 workspace storage found. Add some widgets in the app first.';
            }
            
            // Show all localStorage keys
            const keys = Object.keys(localStorage);
            output.textContent += '\n\nAll localStorage keys: ' + keys.join(', ');
        }
        
        function clearStorage() {
            localStorage.removeItem('classroom-widgets-storage-v2');
            // Also remove any stale pre-V2 key left by an old release.
            localStorage.removeItem('workspace-storage');
            document.getElementById('output').textContent = 'Cleared workspace storage';
        }
    </script>
</body>
</html>
