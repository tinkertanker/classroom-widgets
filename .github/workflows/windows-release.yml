name: Windows Release

on:
  push:
    tags:
      - 'windows-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows app
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: npm ci

      - run: npm run windows:publish

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content packages/windows-dashboard/version.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path packages/windows-dashboard/dist/* `
            -DestinationPath "ClassroomWidgets-v${{ steps.version.outputs.version }}-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ClassroomWidgets-windows-x64
          path: ClassroomWidgets-v*-windows-x64.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ClassroomWidgets-v*-windows-x64.zip
