name: Desktop tests

on:
  pull_request:
    paths:
      - 'packages/windows-dashboard/**'
      - 'packages/macos-dashboard/**'
      - 'packages/linux-dashboard/**'
      - '.github/actions/install-pnpm/**'
      - '.github/actions/install-linux-dependencies/**'
      - '.github/workflows/desktop-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows native tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/install-pnpm
        with:
          cache: store
      - run: pnpm --filter @classroom-widgets/teacher build:desktop
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test application assembly and native controls
        env:
          CLASSROOM_WIDGETS_TEST_EVIDENCE_DIR: ${{ runner.temp }}/windows-test-evidence
          CLASSROOM_WIDGETS_WEB_ROOT: ${{ github.workspace }}/packages/teacher/build
        run: dotnet test packages/windows-dashboard/Tests/ClassroomWidgetsTests --configuration Release --logger "trx;LogFileName=windows.trx" --results-directory "${{ runner.temp }}/windows-test-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-test-evidence
          path: ${{ runner.temp }}/windows-test-evidence

  macos:
    name: macOS native tests
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/install-pnpm
        with:
          cache: store
      # Without the teacher build the real-WebKit tests (WidgetCheckpointTests and
      # friends) skip themselves.
      - run: pnpm --filter @classroom-widgets/teacher build:desktop
      - run: swift test --package-path packages/macos-dashboard
        env:
          CLASSROOM_WIDGETS_WEB_ROOT: ${{ github.workspace }}/packages/teacher/build

  linux:
    name: Linux unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the Linux dependency cache action
        run: node --test .github/actions/install-linux-dependencies/cache.test.cjs
      - uses: ./.github/actions/install-linux-dependencies
      - run: npm test
        working-directory: packages/linux-dashboard
