name: Linux Release

on:
  push:
    tags:
      - 'linux-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Linux app
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 20.x resolves to >=20.19 on the runner, which Electron's postinstall
          # needs for require(esm); do not pin below 20.19.
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/linux-dashboard/package-lock.json

      - run: npm ci

      - name: Install linux-dashboard dependencies
        working-directory: packages/linux-dashboard
        run: npm ci || npm install

      - run: npm run linux:publish

      - uses: actions/upload-artifact@v4
        with:
          name: ClassroomWidgets-linux-x64
          path: |
            packages/linux-dashboard/dist/*.AppImage
            packages/linux-dashboard/dist/*.deb

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./packages/linux-dashboard/version.json').version")" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: packages/linux-dashboard/dist
        run: |
          v='${{ steps.version.outputs.version }}'
          appimage="ClassroomWidgets-v$v-linux-x86_64.AppImage"
          deb="ClassroomWidgets-v$v-linux-amd64.deb"
          notes="$(sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' ../RELEASE_NOTES.md)"
          cat > release-body.md <<EOF
          Classroom Widgets for Linux is a system-tray app for adding floating classroom widgets that stay above your apps.

          ## What's new

          $notes

          ## Install

          - **\`$appimage\`** — portable; \`chmod +x\` it and run. No installation needed.
          - **\`$deb\`** — Debian/Ubuntu package (\`sudo apt install ./$deb\`); installs under \`/opt/Classroom Widgets\`.

          Requires a 64-bit Linux desktop with a system tray. On GNOME, install an AppIndicator extension (e.g. *AppIndicator and KStatusNotifierItem Support*); KDE Plasma, Cinnamon and XFCE work out of the box.

          Supported widgets: Randomiser, Timer, List, Task Cue, Traffic Light, Text Banner, QR Code, Sound Effects.

          ## Download verification

          SHA-256 (\`$appimage\`): \`$(sha256sum "$appimage" | cut -d' ' -f1)\`
          SHA-256 (\`$deb\`): \`$(sha256sum "$deb" | cut -d' ' -f1)\`
          EOF

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Classroom Widgets for Linux v${{ steps.version.outputs.version }}
          body_path: packages/linux-dashboard/dist/release-body.md
          files: |
            packages/linux-dashboard/dist/*.AppImage
            packages/linux-dashboard/dist/*.deb
