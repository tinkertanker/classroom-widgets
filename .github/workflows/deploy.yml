name: Deploy Web to Production

# Builds the teacher app and deploys it to the classroom-widgets-web Worker,
# which serves widgets.tk.sg. The backend (go.tk.sg) is deployed by hand,
# because every backend deploy restarts its container and drops live sessions.
# See deploy/cloudflare/README.md.

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: b8b1032c61d9475cd00229c74db7ec72

    steps:
      # The token is passed only to the steps that need it, not to install/build.
      - name: Require the Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN secret (see docs/DEPLOYMENT.md, Automated Deployment)."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Skip stale runs
        id: tip
        run: |
          git fetch --depth=1 origin master
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "Skipping stale deploy: $GITHUB_SHA is not the tip of master"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.tip.outputs.stale != 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.tip.outputs.stale != 'true'
        with:
          node-version: 22

      - name: Install teacher dependencies
        if: steps.tip.outputs.stale != 'true'
        uses: ./.github/actions/install-pnpm
        with:
          filter: '@classroom-widgets/teacher...'

      - name: Install Cloudflare dependencies
        if: steps.tip.outputs.stale != 'true'
        uses: ./.github/actions/install-pnpm
        with:
          working-directory: deploy/cloudflare

      - name: Build
        if: steps.tip.outputs.stale != 'true'
        working-directory: deploy/cloudflare
        run: pnpm build:teacher --skip-install

      - name: Deploy classroom-widgets-web
        if: steps.tip.outputs.stale != 'true'
        working-directory: deploy/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy -c web/wrangler.jsonc --message "${GITHUB_SHA::7}"

      - name: Verify widgets.tk.sg serves this build
        if: steps.tip.outputs.stale != 'true'
        working-directory: deploy/cloudflare
        run: |
          expected=$(grep -o '/assets/index-[^"]*\.js' web/dist/index.html | head -1)
          for _ in $(seq 1 12); do
            live=$(curl -fsS --connect-timeout 5 --max-time 15 https://widgets.tk.sg/ | grep -o '/assets/index-[^"]*\.js' | head -1 || true)
            if [ "$live" = "$expected" ]; then
              echo "widgets.tk.sg serves $expected (${GITHUB_SHA::7})"
              exit 0
            fi
            sleep 5
          done
          echo "::error::widgets.tk.sg serves '$live', expected '$expected'"
          exit 1
