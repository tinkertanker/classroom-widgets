name: Deploy Web to Production

on:
  push:
    branches:
      - master

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            DEPLOY_SHA="${{ github.sha }}"
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin "$DEPLOY_SHA"
            git fetch origin master
            if [ "$(git rev-parse FETCH_HEAD)" != "$DEPLOY_SHA" ]; then
              echo "Skipping stale deploy: $DEPLOY_SHA is not the tip of master"
              exit 0
            fi
            git reset --hard "$DEPLOY_SHA"
            git clean -ffd
            export VITE_BUILD_ID="$(printf '%.7s' "$DEPLOY_SHA")"
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up --build -d
            echo "Deployed $DEPLOY_SHA successfully"
