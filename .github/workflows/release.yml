name: Release

# One tag (v<version>, from version.json) builds every desktop app and publishes a
# single GitHub release. The macOS DMG is built here only when the repository
# variable MACOS_RELEASE_IN_CI is "true" and the Apple signing secrets exist;
# otherwise build it on an authorised Mac and `gh release upload` it afterwards.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version="$(node -p "require('./version.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match version.json ($version)" >&2
            exit 1
          fi

  windows:
    name: Build Windows app
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm windows:publish
      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path packages/windows-dashboard/dist/* `
            -DestinationPath "ClassroomWidgets-v${{ needs.version.outputs.version }}-windows-x64.zip"
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DAppVersion=${{ needs.version.outputs.version }} `
            /DSourceDir=..\dist /DOutputDir=..\dist-installer `
            packages\windows-dashboard\Installer\ClassroomWidgets.iss
          Move-Item packages\windows-dashboard\dist-installer\*.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            ClassroomWidgets-v*-windows-x64.zip
            ClassroomWidgets-v*-windows-x64-setup.exe

  linux:
    name: Build Linux app
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # The workspace requires >=22.13. Electron's postinstall separately
          # needs >=20.19 for require(esm), which 22 also satisfies; do not pin
          # below either bound.
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # linux-dashboard is deliberately NOT a pnpm workspace member and keeps its
      # own package-lock.json, so it still installs with npm.
      - name: Install linux-dashboard dependencies
        working-directory: packages/linux-dashboard
        run: npm ci || npm install
      - run: pnpm linux:publish
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            packages/linux-dashboard/dist/*.AppImage
            packages/linux-dashboard/dist/*.deb

  macos:
    name: Build macOS app
    needs: version
    if: vars.MACOS_RELEASE_IN_CI == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: brew install create-dmg
      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db
      - name: Build, sign and notarise DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          pnpm macos:dmg -- --distribution --notarise
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/ClassroomWidgets-v*-macos.dmg
            dist/ClassroomWidgets-v*-macos.zip

  release:
    name: Publish GitHub release
    needs: [version, windows, linux, macos]
    # macos is allowed to be skipped (no CI signing configured); everything else must succeed.
    if: always() && needs.windows.result == 'success' && needs.linux.result == 'success' && needs.macos.result != 'failure' && needs.macos.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Write release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd assets
          ls -l
          dmg="ClassroomWidgets-v$VERSION-macos.dmg"
          mac_zip="ClassroomWidgets-v$VERSION-macos.zip"
          setup="ClassroomWidgets-v$VERSION-windows-x64-setup.exe"
          zip="ClassroomWidgets-v$VERSION-windows-x64.zip"
          appimage="ClassroomWidgets-v$VERSION-linux-x86_64.AppImage"
          deb="ClassroomWidgets-v$VERSION-linux-amd64.deb"
          notes="$(sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' ../RELEASE_NOTES.md)"

          if [[ -f "$dmg" ]]; then
            mac_line="- **\`$dmg\`** — open and drag *Classroom Widgets Dashboard* to Applications. Signed and notarised."
            mac_update_line="- **\`$mac_zip\`** — automatic-update payload for existing installations."
          else
            mac_line="- **\`$dmg\`** — open and drag *Classroom Widgets Dashboard* to Applications. (Uploaded separately from a signed build; if it is not attached yet, it is on its way.)"
            mac_update_line="- **\`$mac_zip\`** — automatic-update payload. Uploaded with the separately signed macOS build."
          fi

          {
            cat <<EOF
          Classroom Widgets adds floating classroom widgets that stay above your apps, from a menu-bar icon on macOS or a system-tray icon on Windows and Linux.

          ## What's new

          $notes

          ## Download

          ### macOS
          $mac_line
          $mac_update_line

          Requires macOS 13 or later.

          ### Windows
          - **\`$setup\`** — recommended. Per-user install, no admin rights; offers to start Classroom Widgets automatically when you sign in.
          - **\`$zip\`** — portable; unzip anywhere and run \`ClassroomWidgets.exe\`.

          Requires Windows 10 (1809+) or Windows 11 with the Microsoft Edge WebView2 Runtime (already present on Windows 11 and up-to-date Windows 10). The Windows build is not code-signed yet, so SmartScreen may ask you to choose **More info › Run anyway** on first launch.

          ### Linux
          - **\`$appimage\`** — portable; \`chmod +x\` it and run. No installation needed.
          - **\`$deb\`** — Debian/Ubuntu package (\`sudo apt install ./$deb\`); installs under \`/opt/Classroom Widgets\`.

          Requires a 64-bit Linux desktop with a system tray. On GNOME, install an AppIndicator extension (e.g. *AppIndicator and KStatusNotifierItem Support*); KDE Plasma, Cinnamon and XFCE work out of the box.

          Supported widgets on every platform: Randomiser, Timer, List, Task Cue, Traffic Light, Text Banner, QR Code, Sound Effects.

          ## Download verification

          EOF
            for f in "$dmg" "$mac_zip" "$setup" "$zip" "$appimage" "$deb"; do
              if [[ -f "$f" ]]; then
                echo "SHA-256 (\`$f\`): \`$(sha256sum "$f" | cut -d' ' -f1)\`"
              fi
            done
          } > ../release-body.md
          cat ../release-body.md
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Classroom Widgets v${{ needs.version.outputs.version }}
          body_path: release-body.md
          files: assets/*
