server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Usage dashboard, served by the backend (docs/USAGE_DASHBOARD.md). The
    # name is resolved per request through Docker's DNS so this container
    # starts even when the backend is down. ^~ keeps /admin/logo.svg out of
    # the static asset rule below. X-Forwarded-For is passed on untouched so
    # the backend still counts one proxy hop (TRUST_PROXY) and limits failed
    # sign-ins by the real client address.
    location ^~ /admin {
        resolver 127.0.0.11 valid=30s;
        set $admin_upstream http://classroom-widgets-backend:3001;
        proxy_pass $admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               image/svg+xml;
    gzip_min_length 1000;
}
